version: "3.8"

networks:
  coldchain-net:
    driver: bridge

volumes:
  redpanda-data:

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.8
    container_name: coldchain-redpanda
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp 1
      - --memory 1G
      - --reserve-memory 0M
      - --node-id 0
      - --check=false
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports:
      - "9092:9092"
      - "9645:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    networks:
      - coldchain-net
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true' || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 5

  console:
    image: docker.redpanda.com/redpandadata/console:v2.5.2
    container_name: coldchain-console
    entrypoint: /bin/sh
    command: -c "echo \"$$CONSOLE_CONFIG_FILE\" > /tmp/config.yml; /app/console"
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers: ["redpanda:29092"]
    ports:
      - "8080:8080"
    networks:
      - coldchain-net
    depends_on:
      - redpanda

  simulator:
    profiles: ["sim"]
    build:
      context: ./services/simulator
      dockerfile: Dockerfile
    container_name: coldchain-simulator
    environment:
      - SIM_KAFKA_BOOTSTRAP=redpanda:29092
      - SIM_KAFKA_TOPIC=sensor.readings
      - SIM_TRUCKS=10
      - SIM_TIME_SCALE=60.0
      - SIM_BAD_EVENT_RATE=0.002
      - SIM_EXCURSION_PROB=0.05
      - SIM_INTERVAL_SEC=60
    networks:
      - coldchain-net
    depends_on:
      - redpanda
