# Alembic configuration for ColdChainIQ database migrations

[alembic]
script_location = migrations
prepend_sys_path = . src ../../libs/coldchain_common/src

# Default development database URL; overridden in production/docker by POSTGRES_DSN
sqlalchemy.url = postgresql+psycopg://postgres:postgres@localhost:5432/coldchainiq

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
