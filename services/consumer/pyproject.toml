[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "coldchain_consumer"
version = "0.1.0"
description = "High-throughput Kafka streaming consumer and idempotency pipeline for ColdChainIQ"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "coldchain_common",
    "confluent-kafka>=2.4.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.1.0",
    "redis>=5.0.0",
    "tenacity>=8.2.0",
    "python-json-logger>=2.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
